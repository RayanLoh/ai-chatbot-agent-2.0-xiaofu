[project]
name = "xiaofu-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "google-genai>=1.0,<3",
  "supabase>=2.15,<3",
  "boto3>=1.37,<2",
  "python-dotenv>=1.0,<2",
  "google-auth>=2.38,<3",
  "requests>=2.32,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=12.0,<14",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
